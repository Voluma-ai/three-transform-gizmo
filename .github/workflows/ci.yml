name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  three-versions:
    name: three ${{ matrix.three }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lowest supported peer version, current, and latest
        three: ['0.156.0', '0.185.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save three@${{ matrix.three }} @types/three@${{ matrix.three == 'latest' && 'latest' || matrix.three }}
      - run: npm test
      - run: npm run build
