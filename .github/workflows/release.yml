name: Release

# Publishes to npm when a GitHub Release is published.
#
# Authentication uses npm Trusted Publishing (OIDC): npm verifies that the
# publish comes from this workflow in this repository, so no NPM_TOKEN secret
# is needed. Provenance is attested automatically.
#
# One-time setup on npmjs.com: package settings -> Trusted Publisher ->
# GitHub Actions, with this repository and `release.yml` as the workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which trusted publishing requires. It also
          # satisfies the `engines` floor in package.json.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; pin to latest to be safe.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the tag matches package.json
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run check
      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
