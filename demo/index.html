<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-transform-gizmo demo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #111;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(20, 20, 24, 0.85);
        color: #eee;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.7;
        min-width: 230px;
      }
      #ui button {
        margin-right: 4px;
      }
      #ui .active {
        outline: 2px solid #ffd60a;
      }
      #log {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        max-height: 130px;
        overflow: auto;
        background: rgba(20, 20, 24, 0.7);
        color: #9ac;
        padding: 8px 10px;
        border-radius: 8px;
        font: 11px monospace;
        width: 340px;
      }
      label {
        user-select: none;
      }
      #ui input[type='range'] {
        vertical-align: middle;
        width: 120px;
        margin: 0 6px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div>
        <b>Mode</b> (T/R/S/A):
        <button id="mode-translate" class="active">translate</button>
        <button id="mode-rotate">rotate</button>
        <button id="mode-scale">scale</button>
        <button id="mode-combined">combined</button>
      </div>
      <div>
        <b>Space</b> (Q): <button id="space">world</button> &nbsp; <b>Object</b> (Tab): <button id="cycle">cube</button>
      </div>
      <div>
        <label><input type="checkbox" id="snap" /> snapping (1u / 15&deg; / 0.25)</label>
      </div>
      <div>
        <label><input type="checkbox" id="showX" checked />X</label>
        <label><input type="checkbox" id="showY" checked />Y</label>
        <label><input type="checkbox" id="showZ" checked />Z</label>
        &nbsp; <label><input type="checkbox" id="theme" /> alt theme</label> &nbsp;
        <label><input type="checkbox" id="degrees" /> degrees label</label>
        <label><input type="checkbox" id="scalePct" /> scale %</label>
        <label><input type="checkbox" id="scaleMods" /> scale mods</label>
        <label><input type="checkbox" id="originDist" /> origin dist</label>
      </div>
      <div>
        <label><input type="checkbox" id="compare" /> compare: use three.js TransformControls</label>
      </div>
      <div>
        <label>
          size
          <input type="range" id="size" min="0.2" max="2" step="0.05" value="1" />
          <span id="sizeVal">1.00</span>
        </label>
        &nbsp; <button type="button" id="reset">reset to defaults</button>
      </div>
      <div style="opacity: 0.7">
        Snap: hold <b>Ctrl</b> / <b>Cmd</b> (or enable the snapping checkbox).<br />
        Scale: <b>Alt</b>/<b>Option</b> flips anchor, <b>Shift</b> = uniform + centered.
      </div>
    </div>
    <div id="log"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
