<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-transform-gizmo demo</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #111; }
      #ui {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(20, 20, 24, 0.85); color: #eee; padding: 12px 14px;
        border-radius: 10px; font-size: 13px; line-height: 1.7; min-width: 230px;
      }
      #ui button { margin-right: 4px; }
      #ui .active { outline: 2px solid #ffd60a; }
      #log {
        position: fixed; bottom: 12px; left: 12px; z-index: 10; max-height: 130px; overflow: auto;
        background: rgba(20, 20, 24, 0.7); color: #9ac; padding: 8px 10px;
        border-radius: 8px; font: 11px monospace; width: 340px;
      }
      label { user-select: none; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div>
        <b>Mode</b> (T/R/S):
        <button id="mode-translate" class="active">translate</button>
        <button id="mode-rotate">rotate</button>
        <button id="mode-scale">scale</button>
      </div>
      <div>
        <b>Space</b> (Q): <button id="space">world</button>
        &nbsp; <b>Object</b> (Tab): <button id="cycle">cube</button>
      </div>
      <div>
        <label><input type="checkbox" id="snap" /> snapping (1u / 15&deg; / 0.25)</label>
      </div>
      <div>
        <label><input type="checkbox" id="showX" checked />X</label>
        <label><input type="checkbox" id="showY" checked />Y</label>
        <label><input type="checkbox" id="showZ" checked />Z</label>
        &nbsp; <label><input type="checkbox" id="theme" /> alt theme</label>
      </div>
      <div>
        <label><input type="checkbox" id="compare" /> compare: use three.js TransformControls</label>
      </div>
      <div style="opacity:.7">
        Scale: drag end-handles to extrude (opposite side stays put),<br />
        hold <b>Alt</b> for centered scale. Rotate: hold <b>Shift</b> to snap.
      </div>
    </div>
    <div id="log"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
